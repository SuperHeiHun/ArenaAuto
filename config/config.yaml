version: 2
adb:
  executable: adb
  serial: 192.168.10.12:5555
  reconnect_attempts: 3
  command_timeout: 15.0
automation:
  power_threshold: 2000000
  click_delay: 0.3
  poll_interval: 5.0
  dry_run: false
recognition:
  stable_reads: 2
  retry_count: 3
ocr:
  provider: easyocr
  scale: 3
  threshold: true
  whitelist: 0123456789,
  lang: ch
  dpi: 300
  device: auto
  timeout_ms: 1500
  cache_enabled: true
  cache_difference_threshold: 3.0
  power_allowlist: 0123456789,.
  challenge_allowlist: 0123456789/
  cache:
    enabled: true
    difference_threshold: 3.0
  stability:
    enabled: true
    max_attempts: 3
logging:
  performance: false
battle:
  poll_interval: 5.0
  max_duration: 300.0
purchase:
  enabled: true
  auto_confirm: true
  max_per_session: 10
  buy_button:
    region:
    - 1067
    - 741
    - 110
    - 75
    click:
    - 1122
    - 778
    confidence: 1.0
    source: calibrated
  confirm_button:
    region:
    - 0
    - 0
    - 0
    - 0
    click:
    - 0
    - 0
    confidence: 0.0
    source: default
recovery:
  allow_back: true
  max_attempts: 3
debug:
  enabled: true
  save_screenshots: true
  save_failed_recognition: true
  directory: debug
  allow_ocr_fallback: false
  ocr_fallback_min_failures: 3
timeouts:
  detect_screen: 10.0
  prepare: 15.0
  start_battle: 10.0
  result: 300.0
  purchase: 15.0
  recovery: 30.0
screen:
  reference_width: 1920
  reference_height: 1080
calibration:
  power_region_padding:
    x: 20
    y: 20
  template_padding:
    x: 20
    y: 15
  weights:
    numeric: 0.3
    position: 0.25
    spacing: 0.2
    structure: 0.15
    ocr: 0.1
  min_power_digits: 5
  max_power_digits: 10
  min_ocr_confidence: 0.3
  x_tolerance: 80
  spacing_min: 40
  spacing_max: 400
  slot_match_tolerance: 40
  card_extend_left: 400
  high_confidence: 0.9
  low_confidence: 0.75
  generate_templates: true
  debug_overlays: true
