name: Build Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-gpu.txt

      - name: Install desktop, DirectML OCR and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Run regression tests
        shell: pwsh
        run: python -m pytest tests -q --tb=short

      - name: Verify source OCR runtime and bundled models on CPU
        shell: pwsh
        run: python main.py --self-test --report debug/source-runtime.json

      - name: Download checksum-verified Korean OCR model for the release bundle
        shell: pwsh
        run: python scripts/install_language_models.py --languages korean --engines rapidocr

      - name: Build GPU-capable EXE
        shell: pwsh
        run: python scripts/build.py

      - name: Verify packaged EXE, OCR DLLs and model inference
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist/ArenaAuto/ArenaAuto.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "arenaauto-packaged-runtime.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--report", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw "Packaged OCR smoke test timed out"
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            throw "Packaged OCR smoke test failed (exit $($process.ExitCode))"
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.model_count -ne 2 -or -not $result.default_auto_initialize -or $result.default_ocr_provider -ne "rapidocr") {
            throw "Packaged models or runtime are invalid"
          }
          Get-Content $report
          $koreanReport = Join-Path $env:RUNNER_TEMP "arenaauto-packaged-korean-runtime.json"
          $korean = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--language", "korean", "--report", "`"$koreanReport`"") -PassThru
          if (-not $korean.WaitForExit(180000)) {
            $korean.Kill()
            throw "Packaged Korean OCR model test timed out"
          }
          $korean.WaitForExit()
          if ($korean.ExitCode -ne 0 -or -not (Test-Path $koreanReport)) {
            throw "Packaged Korean OCR model test failed (exit $($korean.ExitCode))"
          }
          $kr = Get-Content $koreanReport -Raw | ConvertFrom-Json
          if (-not $kr.ok -or $kr.language -ne "korean" -or $kr.model_count -ne 2) {
            throw "Packaged Korean OCR models failed validation"
          }
          Get-Content $koreanReport

      - name: Package release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item README.md, LICENSE -Destination "dist/ArenaAuto/"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $zip = "ArenaAuto-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/ArenaAuto" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Set-Content "$zip.sha256" -Encoding ascii
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ArenaAuto-windows-x64
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8.0.2
        with:
          name: ArenaAuto-windows-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            release-assets/*.zip
            release-assets/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
